# Deploy to GitHub Pages.
#
# Retention policy: Only public. Everything tracked in this repo is
# publishable, so CI builds straight from source and deploys on every
# push to `main`. Nothing is withheld or filtered at deploy time.
#
# One-time GitHub setup: Settings > Pages > Source > "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment. Never cancel an in-progress run: the
# deploy job holds the `pages` lock, so `cancel-in-progress: true` lets a
# newly queued request kill a deploy that already has a built artifact,
# and the site silently stays on the previous build. This matches GitHub's
# own Pages starter workflow.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install, build, and upload site
        uses: withastro/action@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
